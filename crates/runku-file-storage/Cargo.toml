[package]
name = "runku-file-storage"
version = "0.1.0"
description = "Scoped application file storage, quotas, signed transfer grants, and filesystem/S3 adapters"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
fs2.workspace = true
hmac.workspace = true
object_store.workspace = true
runku-core = { path = "../runku-core" }
runku-runtime = { path = "../runku-runtime" }
serde.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
ulid.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
