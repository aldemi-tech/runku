[package]
name = "runku-development-client"
version = "0.1.0"
description = "Strict no-proxy Remote Workspace HTTP client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
reqwest.workspace = true
runku-core = { path = "../runku-core" }
runku-development-access = { path = "../runku-development-access" }
runku-protocol = { path = "../runku-protocol" }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true

[dev-dependencies]
axum.workspace = true
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
