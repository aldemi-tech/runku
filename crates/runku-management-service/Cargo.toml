[package]
name = "runku-management-service"
version = "0.1.0"
description = "Authenticated self-hosted Management API for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
runku-core = { path = "../runku-core" }
runku-identity = { path = "../runku-identity" }
runku-identity-provider = { path = "../runku-identity-provider" }
runku-platform-identity = { path = "../runku-platform-identity" }
runku-protocol = { path = "../runku-protocol" }
runku-value = { path = "../runku-value" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true
