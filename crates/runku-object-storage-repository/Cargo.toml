[package]
name = "runku-object-storage-repository"
version = "0.1.0"
description = "SQLite and PostgreSQL repositories for Runku logical Object Storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
runku-core = { path = "../runku-core" }
runku-object-storage = { path = "../runku-object-storage" }
runku-value = { path = "../runku-value" }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["any", "postgres", "sqlite-bundled", "runtime-tokio", "tls-rustls"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
