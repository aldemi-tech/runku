[package]
name = "runku-runtime"
version = "0.1.0"
description = "Bounded Safe V8 runtime and invocation supervisor for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
deno_core.workspace = true
deno_error.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
runku-core = { path = "../runku-core" }
runku-contracts = { path = "../runku-contracts" }
runku-identity = { path = "../runku-identity" }
runku-observability = { path = "../runku-observability" }
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
runku-schema = { path = "../runku-schema" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
