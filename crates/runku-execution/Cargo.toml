[package]
name = "runku-execution"
version = "0.1.0"
description = "Product Base invocation coordination across Runku runtime and logical storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
runku-core = { path = "../runku-core" }
runku-data = { path = "../runku-data" }
runku-identity = { path = "../runku-identity" }
runku-releases = { path = "../runku-releases" }
runku-runtime = { path = "../runku-runtime" }
runku-schema = { path = "../runku-schema" }
runku-value = { path = "../runku-value" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
sha2.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
runku-data-conformance = { path = "../runku-data-conformance" }
runku-data-postgres = { path = "../runku-data-postgres" }
runku-data-sqlite = { path = "../runku-data-sqlite" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
