[package]
name = "runku-environment-configuration"
version = "0.1.0"
description = "Environment-scoped variables and encrypted secret references for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true
runku-core = { path = "../runku-core" }
runku-value = { path = "../runku-value" }
sha2.workspace = true
sqlx = { workspace = true, features = ["any", "sqlite-bundled", "runtime-tokio", "tls-rustls"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
