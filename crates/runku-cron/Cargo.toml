[package]
name = "runku-cron"
version = "0.1.0"
description = "Durable Cron activation and Scheduled Invocation materialization for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
runku-core = { path = "../runku-core" }
runku-data = { path = "../runku-data" }
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
sha2.workspace = true
sqlx = { workspace = true, features = ["any", "postgres", "sqlite-bundled", "runtime-tokio", "tls-rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
ulid.workspace = true

[dev-dependencies]
runku-data-postgres = { path = "../runku-data-postgres" }
runku-data-sqlite = { path = "../runku-data-sqlite" }
runku-execution = { path = "../runku-execution" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
