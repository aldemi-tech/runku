[package]
name = "runku-server"
version = "0.2.0"
description = "Self-hosted Runku server composition"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "runku-server"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
runku-management-service = { path = "../runku-management-service" }
runku-core = { path = "../runku-core" }
runku-development = { path = "../runku-development" }
runku-identity = { path = "../runku-identity" }
runku-identity-provider = { path = "../runku-identity-provider" }
runku-platform-identity = { path = "../runku-platform-identity" }
runku-local = { path = "../runku-local" }
runku-observability = { path = "../runku-observability" }
runku-protocol = { path = "../runku-protocol" }
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
url.workspace = true

[lints]
workspace = true
