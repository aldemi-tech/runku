[package]
name = "runku-server"
version = "0.4.5"
description = "Self-hosted Runku server composition"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "runku-server"
path = "src/main.rs"

[dependencies]
async-nats.workspace = true
async-trait.workspace = true
base64.workspace = true
runku-management-service = { path = "../runku-management-service" }
runku-core = { path = "../runku-core" }
runku-contracts = { path = "../runku-contracts" }
runku-cron = { path = "../runku-cron" }
runku-data = { path = "../runku-data" }
runku-data-postgres = { path = "../runku-data-postgres" }
runku-data-sqlite = { path = "../runku-data-sqlite" }
runku-development = { path = "../runku-development" }
runku-environment-repository = { path = "../runku-environment-repository" }
runku-environments = { path = "../runku-environments" }
runku-gateway = { path = "../runku-gateway" }
runku-file-storage = { path = "../runku-file-storage" }
runku-execution = { path = "../runku-execution" }
runku-identity = { path = "../runku-identity" }
runku-identity-provider = { path = "../runku-identity-provider" }
runku-platform-identity = { path = "../runku-platform-identity" }
runku-local = { path = "../runku-local" }
runku-observability = { path = "../runku-observability" }
runku-object-storage = { path = "../runku-object-storage" }
runku-object-storage-repository = { path = "../runku-object-storage-repository" }
runku-protocol = { path = "../runku-protocol" }
runku-releases = { path = "../runku-releases" }
runku-schema = { path = "../runku-schema" }
runku-serving = { path = "../runku-serving" }
runku-serving-repository = { path = "../runku-serving-repository" }
runku-value = { path = "../runku-value" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
runku-build = { path = "../runku-build" }
sqlx.workspace = true
tempfile.workspace = true
