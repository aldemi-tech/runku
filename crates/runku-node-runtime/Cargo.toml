[package]
name = "runku-node-runtime"
version = "0.1.0"
description = "Out-of-process Full Node execution boundary for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
ipnet.workspace = true
runku-core = { path = "../runku-core" }
runku-execution-queue = { path = "../runku-execution-queue" }
runku-observability = { path = "../runku-observability" }
runku-protocol = { path = "../runku-protocol" }
runku-contracts = { path = "../runku-contracts" }
runku-releases = { path = "../runku-releases" }
runku-runtime = { path = "../runku-runtime" }
runku-value = { path = "../runku-value" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "sync", "time"] }

[dev-dependencies]
async-nats.workspace = true
runku-build = { path = "../runku-build" }
runku-artifact-s3 = { path = "../runku-artifact-s3" }
runku-file-storage = { path = "../runku-file-storage" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[lints]
workspace = true
