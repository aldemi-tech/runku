[package]
name = "runku-build"
version = "0.1.0"
description = "Strict TypeScript/JavaScript source build toolchain for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deno_ast.workspace = true
swc_ecma_transforms_module.workspace = true
runku-contracts = { path = "../runku-contracts" }
runku-core = { path = "../runku-core" }
runku-protocol = { path = "../runku-protocol" }
runku-releases = { path = "../runku-releases" }
runku-schema = { path = "../runku-schema" }
runku-value = { path = "../runku-value" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync"] }
ulid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
