[package]
name = "runku-cli"
version = "0.4.5"
description = "Strict local Product Base command-line interface for Runku"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "runku"
path = "src/main.rs"

[dependencies]
base64.workspace = true
getrandom.workspace = true
runku-build = { path = "../runku-build" }
runku-core = { path = "../runku-core" }
runku-development = { path = "../runku-development" }
runku-development-access = { path = "../runku-development-access" }
runku-development-client = { path = "../runku-development-client" }
runku-gateway = { path = "../runku-gateway" }
runku-identity = { path = "../runku-identity" }
runku-local = { path = "../runku-local" }
runku-observability = { path = "../runku-observability" }
runku-otel = { path = "../runku-otel" }
runku-platform-identity = { path = "../runku-platform-identity" }
runku-protocol = { path = "../runku-protocol" }
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
rpassword.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
zeroize.workspace = true

[dev-dependencies]
runku-development-service = { path = "../runku-development-service" }
runku-release-repository = { path = "../runku-release-repository" }
tempfile.workspace = true

[lints]
workspace = true
