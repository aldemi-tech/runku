[package]
name = "runku-otel"
version = "0.1.0"
description = "Durable OTLP/HTTP Logs exporter for Runku Operational Events"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
reqwest.workspace = true
runku-core = { path = "../runku-core" }
runku-observability = { path = "../runku-observability" }
runku-releases = { path = "../runku-releases" }
runku-value = { path = "../runku-value" }
sha2.workspace = true
sqlx = { workspace = true, features = ["any", "postgres", "sqlite-bundled", "runtime-tokio", "tls-rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
ulid.workspace = true

[lints]
workspace = true
