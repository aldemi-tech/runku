name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # V8 plus every workspace test target exceeds the hosted runner disk budget when Rust keeps
  # incremental state and full debug symbols. CI does not consume either artifact.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20.18.1
          cache: pnpm
      - name: Install Rust toolchain
        run: make toolchain
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository gate
        run: make check
