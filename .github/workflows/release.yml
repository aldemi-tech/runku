name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing release workflow run whose artifacts should be published without rebuilding
        required: false
        type: string
      release_tag:
        description: Existing tag to finish when artifact_run_id is provided
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: verify
        name: Verify tag and coordinated versions
        run: |
          if test "$GITHUB_REF_TYPE" = tag; then
            node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/verify-release.mjs
          fi

  sdk-packages:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.18.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused package checks
        run: pnpm check:packages
      - name: Verify release metadata
        run: pnpm check:release
      - name: Pack public JavaScript packages
        run: |
          mkdir -p out/npm
          cp LICENSE packages/cli/LICENSE
          npm pack ./packages/client --pack-destination out/npm
          npm pack ./packages/server --pack-destination out/npm
          npm pack ./packages/cli --pack-destination out/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-npm-independent
          path: out
          if-no-files-found: error
          compression-level: 0

  selfhost-package:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and statically validate the compact installation
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ./scripts/prepare-selfhost-package.sh "$VERSION" out
          cp deployments/docker/.env.example out/archive/runku-selfhost-v${VERSION}/.env
          RUNKU_UID=65532 RUNKU_GID=65532 \
            docker compose \
              --project-directory out/archive/runku-selfhost-v${VERSION} \
              --env-file out/archive/runku-selfhost-v${VERSION}/.env \
              -f out/archive/runku-selfhost-v${VERSION}/compose.yaml \
              config --quiet
          rm out/archive/runku-selfhost-v${VERSION}/.env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-selfhost
          path: out/release/*
          if-no-files-found: error
          compression-level: 0

  cli-binaries:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            duckdb_archive: libduckdb-windows-arm64.zip
            duckdb_sha256: 006f8df62957f640a100d673432a5b6f9a7002662822a4567ed06a436ee1d801
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            duckdb_archive: libduckdb-windows-amd64.zip
            duckdb_sha256: 8375eb1fcf2212e8a0817950354815d4dde9dd383c2d9fa7b8975b71e278c1bd
    runs-on: ${{ matrix.runner }}
    name: cli-binaries (${{ matrix.target }})
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cli-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            release-cli-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Verify native Rust host
        shell: pwsh
        run: |
          $hostTriple = ((rustc -vV | Select-String '^host: ').Line -replace '^host: ', '')
          if ($hostTriple -ne '${{ matrix.target }}') {
            throw "runner Rust host $hostTriple does not match ${{ matrix.target }}"
          }
      - name: Build only the CLI release binary
        if: runner.os != 'Windows'
        run: cargo build --package runku-cli --release --locked
      - name: Build the CLI with the verified DuckDB runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '${{ matrix.duckdb_archive }}'
          $runtime = Join-Path $env:RUNNER_TEMP 'duckdb-runtime'
          Invoke-WebRequest -Uri 'https://github.com/duckdb/duckdb/releases/download/v1.5.5/${{ matrix.duckdb_archive }}' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.duckdb_sha256 }}') {
            throw "DuckDB archive digest mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $runtime
          $env:DUCKDB_LIB_DIR = $runtime
          $env:DUCKDB_INCLUDE_DIR = $runtime
          $env:DUCKDB_STATIC = '0'
          cargo build --package runku-cli --release --locked
          Copy-Item (Join-Path $runtime 'duckdb.dll') target/release/duckdb.dll
      - name: Run basic binary validation
        shell: pwsh
        run: |
          $binary = if ('${{ runner.os }}' -eq 'Windows') { 'target/release/runku.exe' } else { 'target/release/runku' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'runku ${{ needs.metadata.outputs.version }}') {
            throw "unexpected version output: $version"
          }
          $help = & $binary --help
          if ($LASTEXITCODE -ne 0 -or -not ($help -match 'runku dev')) {
            throw 'CLI help smoke check failed'
          }
      - id: prepare
        name: Prepare matching archive and native npm package
        shell: pwsh
        run: |
          $binary = if ('${{ runner.os }}' -eq 'Windows') { 'target/release/runku.exe' } else { 'target/release/runku' }
          node scripts/prepare-native-cli-package.mjs '${{ matrix.target }}' $binary out
      - name: Create tar archive
        if: steps.prepare.outputs.archive_format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p out/release
          tar -czf "out/release/${{ steps.prepare.outputs.archive_base }}.tar.gz" \
            -C out/archive "${{ steps.prepare.outputs.archive_base }}"
      - name: Create ZIP archive
        if: steps.prepare.outputs.archive_format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Compress-Archive -Path "out/archive/${{ steps.prepare.outputs.archive_base }}" -DestinationPath "out/release/${{ steps.prepare.outputs.archive_base }}.zip"
      - name: Pack the native npm package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/npm | Out-Null
          npm pack './${{ steps.prepare.outputs.package_directory }}' --pack-destination out/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            out/release/*
            out/npm/*.tgz
          if-no-files-found: error
          compression-level: 0

  server-binaries:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    name: server-binaries (${{ matrix.target }})
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-server-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            release-server-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Verify native Rust host
        run: |
          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host_triple" = '${{ matrix.target }}'
      - name: Build only the server release binary
        run: cargo build --package runku-server --release --locked
      - name: Run basic server validation
        run: test "$(target/release/runku-server version)" = 'runku-server ${{ needs.metadata.outputs.version }}'
      - name: Prepare server archive and image input
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          archive_base="runku-server-v${VERSION}-${TARGET}"
          mkdir -p "out/archive/${archive_base}" "out/release" "out/server/${TARGET}"
          install -m 0755 target/release/runku-server "out/archive/${archive_base}/runku-server"
          install -m 0755 target/release/runku-server "out/server/${TARGET}/runku-server"
          install -m 0644 distribution/SERVER-README.md "out/archive/${archive_base}/README.md"
          install -m 0644 LICENSE "out/archive/${archive_base}/LICENSE"
          tar -czf "out/release/${archive_base}.tar.gz" -C out/archive "$archive_base"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-${{ matrix.target }}
          path: out
          if-no-files-found: error
          compression-level: 0

  server-image:
    if: github.ref_type == 'tag'
    needs: [metadata, cli-binaries, server-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-x86_64-unknown-linux-gnu
          path: inputs/server-amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-aarch64-unknown-linux-gnu
          path: inputs/server-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86_64-unknown-linux-gnu
          path: inputs/cli-amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-aarch64-unknown-linux-gnu
          path: inputs/cli-arm64
      - name: Prepare architecture-specific image contexts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p image-amd64 image-arm64 extract-amd64 extract-arm64
          cp inputs/server-amd64/server/x86_64-unknown-linux-gnu/runku-server image-amd64/runku-server
          cp inputs/server-arm64/server/aarch64-unknown-linux-gnu/runku-server image-arm64/runku-server
          tar -xzf "inputs/cli-amd64/release/runku-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C extract-amd64
          tar -xzf "inputs/cli-arm64/release/runku-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz" -C extract-arm64
          cp "extract-amd64/runku-v${VERSION}-x86_64-unknown-linux-gnu/runku" image-amd64/runku
          cp "extract-arm64/runku-v${VERSION}-aarch64-unknown-linux-gnu/runku" image-arm64/runku
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Publish immutable architecture images and multi-platform manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker buildx create --name runku-release-builder --use
          docker buildx build --platform linux/amd64 --file deployments/docker/server.Dockerfile \
            --build-arg "RUNKU_VERSION=${VERSION}" --build-arg "RUNKU_REVISION=${REVISION}" \
            --provenance=mode=max --sbom=true --push \
            --tag "ghcr.io/aldemi-tech/runku-server:${VERSION}-amd64" image-amd64
          docker buildx build --platform linux/arm64 --file deployments/docker/server.Dockerfile \
            --build-arg "RUNKU_VERSION=${VERSION}" --build-arg "RUNKU_REVISION=${REVISION}" \
            --provenance=mode=max --sbom=true --push \
            --tag "ghcr.io/aldemi-tech/runku-server:${VERSION}-arm64" image-arm64
          docker buildx imagetools create \
            --tag "ghcr.io/aldemi-tech/runku-server:${VERSION}" \
            --tag "ghcr.io/aldemi-tech/runku-server:sha-${REVISION}" \
            "ghcr.io/aldemi-tech/runku-server:${VERSION}-amd64" \
            "ghcr.io/aldemi-tech/runku-server:${VERSION}-arm64"
          mkdir -p out/release
          docker buildx imagetools inspect \
            "ghcr.io/aldemi-tech/runku-server:${VERSION}" \
            >out/release/runku-server-image.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-image-metadata
          path: out
          if-no-files-found: error
          compression-level: 0

  selfhost-artifact-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id == ''
    needs: [metadata, selfhost-package, cli-binaries, server-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-x86_64-unknown-linux-gnu
          path: inputs/server
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86_64-unknown-linux-gnu
          path: inputs/cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-selfhost
          path: inputs/selfhost
      - name: Exercise the clean compact package and disaster restore
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          server_archive=$(find inputs/server -type f -name 'runku-server-*.tar.gz' -print -quit)
          cli_archive=$(find inputs/cli -type f -name 'runku-*.tar.gz' -print -quit)
          selfhost_archive=$(find inputs/selfhost -type f -name 'runku-selfhost-*.tar.gz' -print -quit)
          ./scripts/selfhost-artifact-evidence.sh \
            "$VERSION" "$server_archive" "$cli_archive" "$selfhost_archive"

  publish-npm:
    if: github.ref_type == 'tag'
    needs: [metadata, sdk-packages, cli-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish or verify the complete npm release
        run: node scripts/publish-npm.mjs out

  github-release:
    if: github.ref_type == 'tag'
    needs: [metadata, publish-npm, selfhost-package, server-binaries, server-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Generate release checksums
        working-directory: out/release
        run: sha256sum runku-* > SHA256SUMS
      - name: Attest downloadable release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" out/release/* \
              --verify-tag \
              --generate-notes \
              --title "Runku $RELEASE_TAG"
          fi

  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.release_tag != ''
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify requested release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG"
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Publish or verify the complete npm release
        run: node scripts/publish-npm.mjs out
      - name: Generate release checksums
        working-directory: out/release
        run: sha256sum runku-* > SHA256SUMS
      - name: Attest downloadable release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" out/release/* \
              --verify-tag \
              --generate-notes \
              --title "Runku $RELEASE_TAG"
          fi
